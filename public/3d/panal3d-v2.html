<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Honeycomb 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 50% 26%,#1d3230,#0b1312);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:#f3efe2}
  canvas{display:block}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:22px 26px;box-sizing:border-box}
  header h1{font-size:14px;letter-spacing:.22em;margin:0;font-weight:700}
  header p{margin:5px 0 0;font-size:12px;color:#8fa396;letter-spacing:.04em}
  #foot{display:flex;flex-direction:column;align-items:center;gap:12px}
  #hint{font-size:12px;color:#8fa396;letter-spacing:.04em;transition:color .4s}
  #btn{pointer-events:auto;border:0;border-radius:12px;padding:14px 30px;font-size:13px;font-weight:700;letter-spacing:.14em;color:#241a06;background:linear-gradient(180deg,#f6c64a,#e8a62e);cursor:pointer;box-shadow:0 8px 22px rgba(232,166,46,.32),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .08s,filter .2s}
  #btn:hover{filter:brightness(1.06)}
  #btn:active{transform:translateY(2px)}
  #btn:disabled{filter:saturate(.4) brightness(.8);cursor:default}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui">
  <header>
    <h1>HONEYCOMB · 3D</h1>
    <p>drag to rotate &nbsp;·&nbsp; scroll to zoom in &nbsp;·&nbsp; look at it from above</p>
  </header>
  <div id="foot">
    <div id="hint">every bee is a square — when they land they draw the QR code</div>
    <button id="btn">SHAKE HIVE</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const QR = [
"QQQQQQQ...Q.Q..QQ.QQQQQQQ",
"Q.....Q.Q...QQQ.Q.Q.....Q",
"Q.QQQ.Q.QQQ..Q.Q..Q.QQQ.Q",
"Q.QQQ.Q.Q.Q.....Q.Q.QQQ.Q",
"Q.QQQ.Q...Q.Q..QQ.Q.QQQ.Q",
"Q.....Q..QQ.Q..Q..Q.....Q",
"QQQQQQQ.Q.Q.Q.Q.Q.QQQQQQQ",
"........Q.....QQQ........",
"Q.....Q.Q..Q.....QQ..QQQ.",
".....Q.Q..QQQQ..Q..QQQQQ.",
".Q..QQQ..QQQQQQQ.QQ..Q.QQ",
"..QQ.Q.QQQ.Q.Q.QQQQ..Q..Q",
"Q.Q.QQQ.QQ.QQQ.Q..Q.....Q",
"QQQQQ..QQ.Q....QQ..Q...Q.",
"Q.....Q.Q..QQ..QQQ.QQQ.QQ",
"Q.QQ....QQ.Q.......Q.QQ.Q",
"Q.Q.QQQ.Q..Q...QQQQQQ.Q..",
"........Q...QQQ.Q...Q....",
"QQQQQQQ...QQ....Q.Q.Q...Q",
"Q.....Q..Q..QQ.QQ...Q..Q.",
"Q.QQQ.Q..QQ.Q.QQQQQQQ.QQ.",
"Q.QQQ.Q..Q....Q.Q.Q.....Q",
"Q.QQQ.Q..Q.QQ........QQ.Q",
"Q.....Q...QQ..Q.QQ.QQ...Q",
"QQQQQQQ.QQQ..QQ.QQ...Q..Q"];

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x12201d, 34, 64);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 130);
camera.position.set(14, 9.5, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 8;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.55;

window.setView = (polarDeg, aziDeg, dist = 23) => {
  const p = THREE.MathUtils.degToRad(polarDeg), a = THREE.MathUtils.degToRad(aziDeg);
  const t = controls.target;
  camera.position.set(
    t.x + dist*Math.sin(p)*Math.sin(a),
    t.y + dist*Math.cos(p),
    t.z + dist*Math.sin(p)*Math.cos(a)
  );
  camera.lookAt(t);
};

scene.add(new THREE.HemisphereLight(0xfff2d4, 0x27403a, 0.95));
const sun = new THREE.DirectionalLight(0xffe2a8, 0.9);
sun.position.set(10, 15, 6);
scene.add(sun);
const fillLight = new THREE.DirectionalLight(0x5fd0a8, 0.18);
fillLight.position.set(-9, 6, -10);
scene.add(fillLight);

let seed = 31;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const M = new THREE.Matrix4();
const C = new THREE.Color();
const Q = new THREE.Quaternion();
const E = new THREE.Euler();
const V1 = new THREE.Vector3();
const SCL = new THREE.Vector3(1,1,1);
const HIDE = new THREE.Matrix4().makeScale(0,0,0);

// ---------- square ground ----------
const S = 17;
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(S, 0.22, S),
  new THREE.MeshLambertMaterial({color:0x17241f})
);
ground.position.y = -0.11;
scene.add(ground);
const rimMat = new THREE.MeshBasicMaterial({color:0xb8862f});
[[0,-S/2],[0,S/2],[-S/2,0],[S/2,0]].forEach(([x,z], i) => {
  const r = new THREE.Mesh(new THREE.BoxGeometry(i<2?S+0.1:0.1, 0.08, i<2?0.1:S+0.1), rimMat);
  r.position.set(x, 0.02, z);
  scene.add(r);
});

// ---------- branch the hive hangs from ----------
const CS = 0.22;
const woodMat = new THREE.MeshLambertMaterial({color:0xffffff, transparent:true, opacity:1});
const woodCells = [];
for (let i = 0; i <= 26; i++) {
  const t = i/26;
  woodCells.push([
    Math.round((0.2 + 5.2*t)/CS)*CS,
    Math.round((9.6 + 2.6*t*t)/CS)*CS,
    Math.round((-1.1*t)/CS)*CS
  ]);
}
woodCells.push([0, 9.2, 0], [0.11, 9.4, 0]);
const woodGeo = new THREE.BoxGeometry(CS*1.5, CS*1.5, CS*1.5);
const wood = new THREE.InstancedMesh(woodGeo, woodMat, woodCells.length);
woodCells.forEach(([x,y,z], i) => {
  M.makeTranslation(x, y, z);
  wood.setMatrixAt(i, M);
  const v = 0.8 + (rnd()-0.5)*0.2;
  C.setRGB(0.32*v, 0.22*v, 0.13*v);
  wood.setColorAt(i, C);
});
wood.instanceColor.needsUpdate = true;
scene.add(wood);

// ---------- hanging hive (pivoted at the anchor point) ----------
const PIVOT = new THREE.Vector3(0, 9.4, 0);
const hiveGroup = new THREE.Group();
hiveGroup.position.copy(PIVOT);
scene.add(hiveGroup);

const ENTRANCE = new THREE.Vector3(0, 6.3, 1.9);
const hiveCells = [];
const hiveDark = [];
for (let x = -2.8; x <= 2.8; x += CS)
for (let y = 5.6;  y <= 9.5; y += CS)
for (let z = -2.8; z <= 2.8; z += CS) {
  const ringBulge = 1 + 0.07*Math.sin((y-5.5)*4.4);
  const a = 2.35*ringBulge, b = 2.05;
  const dy = (y-7.55)/b;
  if ((x*x + z*z)/(a*a) + dy*dy > 1) continue;
  const isEntr = Math.abs(x) < 0.45 && Math.abs(y-6.4) < 0.5 && z > 1.0;
  hiveCells.push([x, y, z]);
  hiveDark.push(isEntr);
}
const hiveGeo = new THREE.BoxGeometry(CS*0.98, CS*0.98, CS*0.98);
const hiveMat = new THREE.MeshLambertMaterial({color:0xffffff, transparent:true, opacity:1});
const hive = new THREE.InstancedMesh(hiveGeo, hiveMat, hiveCells.length);
hiveCells.forEach(([x,y,z], i) => {
  M.makeTranslation(x - PIVOT.x, y - PIVOT.y, z - PIVOT.z);
  hive.setMatrixAt(i, M);
  if (hiveDark[i]) {
    C.setRGB(0.1, 0.06, 0.02);
  } else {
    const band = 0.8 + 0.2*Math.sin((y-5.5)*4.4);
    const v = band + (rnd()-0.5)*0.1;
    C.setRGB(1.0*v, 0.62*v, 0.14*v);
  }
  hive.setColorAt(i, C);
});
hive.instanceColor.needsUpdate = true;
hiveGroup.add(hive);

// honey glow that pulses at the entrance
const glow = new THREE.PointLight(0xffb545, 3, 8);
glow.position.set(ENTRANCE.x, ENTRANCE.y, ENTRANCE.z + 0.5);
scene.add(glow);

// ---------- bees ----------
const BEE = 0.3;
const beeGeo = new THREE.BoxGeometry(BEE, BEE, BEE);
const beeGold = [0xf2b53a, 0xe8a62e, 0xf6c64a, 0xd9952a];

// ambient bees orbiting the hive
const NORB = 14;
const orbMat = new THREE.MeshLambertMaterial({color:0xffffff});
const orbMesh = new THREE.InstancedMesh(beeGeo, orbMat, NORB);
const orbs = [];
for (let i = 0; i < NORB; i++) {
  orbs.push({r:2.9+rnd()*1.2, w:(0.8+rnd()*0.9)*(rnd()<0.5?-1:1), a0:rnd()*6.28, yb:6.2+rnd()*2.2, ph:rnd()*6.28});
  C.set(beeGold[(rnd()*beeGold.length)|0]);
  orbMesh.setColorAt(i, C);
}
orbMesh.instanceColor.needsUpdate = true;
scene.add(orbMesh);

// ---------- swarm that draws the QR ----------
const MSZ = 0.336;
const modules = [];
QR.forEach((row, r) => [...row].forEach((ch, c) => {
  if (ch === 'Q') modules.push({x:(c-12)*MSZ, z:(r-12)*MSZ});
}));
const order = modules.map((_, i) => i);
for (let i = order.length-1; i > 0; i--) { const j = (rnd()*(i+1))|0; [order[i],order[j]] = [order[j],order[i]]; }
const jobs = modules.map((m, i) => ({
  tx:m.x, tz:m.z,
  delay:order.indexOf(i)*0.013,
  dur:1.7+rnd()*0.9, p:0, ph:rnd()*6.28,
  cx:(rnd()-0.5)*9, cy:3.6+rnd()*3.4, cz:(rnd()-0.5)*9,
  sx:ENTRANCE.x+(rnd()-0.5)*0.3, sy:ENTRANCE.y+(rnd()-0.5)*0.3, sz:ENTRANCE.z+rnd()*0.3,
  started:false, landed:false
}));

// the bees orbiting the hive also descend: they take the first modules
const orbJobs = [...jobs].sort((a,b) => a.delay - b.delay).slice(0, NORB);
orbJobs.forEach((j, k) => { j.fromOrbit = k; });

const swarmMat = new THREE.MeshLambertMaterial({color:0xffffff, emissive:0x241403});
const swarm = new THREE.InstancedMesh(beeGeo, swarmMat, jobs.length);
jobs.forEach((j, i) => {
  swarm.setMatrixAt(i, HIDE);
  C.set(beeGold[(rnd()*beeGold.length)|0]);
  swarm.setColorAt(i, C);
});
jobs.forEach((j, i) => {
  if (j.fromOrbit !== undefined) { orbMesh.getColorAt(j.fromOrbit, C); swarm.setColorAt(i, C); }
});
swarm.instanceColor.needsUpdate = true;
scene.add(swarm);

// ---------- interaction ----------
const btn = document.getElementById('btn');
const hint = document.getElementById('hint');
let mode = 'idle';
let formT = 0, landedCount = 0;

btn.addEventListener('click', () => {
  if (mode === 'idle') {
    orbJobs.forEach((j, k) => {
      const o = orbs[k];
      const a = o.a0 + clock.elapsedTime*o.w;
      j.sx = Math.cos(a)*o.r; j.sy = o.yb; j.sz = Math.sin(a)*o.r;
      j.cx = j.sx*1.6; j.cy = 2.2 + rnd()*1.6; j.cz = j.sz*1.6;
      j.delay = 0.25 + k*0.09; j.dur = 1.3 + rnd()*0.5;
    });
    mode = 'forming'; formT = 0; landedCount = 0;
    btn.disabled = true; btn.textContent = 'SHAKING…';
    hint.textContent = 'the hive trembles — the swarm flies out to land…';
  } else if (mode === 'done') {
    jobs.forEach(j => { j.p = 0; j.started = false; j.landed = false; });
    for (let i = 0; i < jobs.length; i++) swarm.setMatrixAt(i, HIDE);
    swarm.instanceMatrix.needsUpdate = true;
    mode = 'idle';
    btn.textContent = 'SHAKE HIVE';
    hint.textContent = 'every bee is a square — when they land they draw the QR code';
  }
});
window.__state = () => ({mode, formT, landedCount, total:jobs.length, frames:window.__fr||0});

// ---------- animation ----------
const clock = new THREE.Clock();
function animate(){
  window.__fr = (window.__fr||0)+1;
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // hive sway; strong shake when pressed
  let sway = Math.sin(t*0.9)*0.025;
  if (mode === 'forming' && formT < 2.2) {
    sway += Math.sin(formT*26)*0.1*Math.exp(-formT*1.6);
  }
  hiveGroup.rotation.z = sway;
  hiveGroup.rotation.x = Math.cos(t*0.7)*0.015;
  glow.intensity = (3.2 + Math.sin(t*2.1)*1.3 + Math.sin(t*5.3)*0.7) * hiveMat.opacity;

  // top view: hive and branch fade out
  const camDir = camera.position.clone().sub(controls.target);
  const polar = Math.acos(Math.min(1, Math.max(-1, camDir.y / camDir.length())));
  const fadeTarget = THREE.MathUtils.clamp((THREE.MathUtils.radToDeg(polar) - 20) / 26, 0, 1);
  hiveMat.opacity += (fadeTarget - hiveMat.opacity) * Math.min(1, dt*6);
  woodMat.opacity = hiveMat.opacity;
  hive.visible = hiveMat.opacity > 0.02;
  wood.visible = hive.visible;

  // ambient bees orbiting; when shaken, they descend with the swarm
  orbs.forEach((o, i) => {
    if (mode !== 'idle') { orbMesh.setMatrixAt(i, HIDE); return; }
    const a = o.a0 + t*o.w;
    V1.set(
      Math.cos(a)*o.r + Math.sin(t*9+o.ph)*0.12,
      o.yb + Math.sin(t*1.3+o.ph)*0.5 + Math.sin(t*11+o.ph)*0.08,
      Math.sin(a)*o.r + Math.cos(t*8.5+o.ph)*0.12
    );
    E.set(0, -a, 0);
    Q.setFromEuler(E);
    M.compose(V1, Q, SCL);
    orbMesh.setMatrixAt(i, M);
  });
  orbMesh.instanceMatrix.needsUpdate = true;

  // swarm: exits through the entrance, curved flight and lands on the module
  if (mode === 'forming') {
    formT += dt;
    let touched = false;
    jobs.forEach((j, i) => {
      if (j.landed || formT < j.delay) return;
      j.started = true;
      j.p += dt / j.dur;
      touched = true;
      if (j.p >= 1) {
        j.landed = true; landedCount++;
        V1.set(j.tx + (rnd()-0.5)*0.03, BEE/2 + 0.11, j.tz + (rnd()-0.5)*0.03);
        E.set(0, (rnd()-0.5)*0.4, 0);
        Q.setFromEuler(E);
        M.compose(V1, Q, SCL);
        swarm.setMatrixAt(i, M);
      } else {
        const p = j.p, q = 1-p;
        const buzz = (1-p)*0.1;
        V1.set(
          q*q*j.sx + 2*q*p*j.cx + p*p*j.tx + Math.sin(p*42+j.ph)*buzz,
          q*q*j.sy + 2*q*p*j.cy + p*p*(BEE/2+0.11),
          q*q*j.sz + 2*q*p*j.cz + p*p*j.tz + Math.cos(p*38+j.ph)*buzz
        );
        E.set(0, j.ph + p*5, Math.sin(p*30+j.ph)*0.2);
        Q.setFromEuler(E);
        M.compose(V1, Q, SCL);
        swarm.setMatrixAt(i, M);
      }
    });
    if (touched) swarm.instanceMatrix.needsUpdate = true;
    if (landedCount === jobs.length) {
      mode = 'done';
      btn.disabled = false; btn.textContent = 'BACK TO THE HIVE';
      hint.textContent = 'the bees form the QR — look at it from above · pen.dev';
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
